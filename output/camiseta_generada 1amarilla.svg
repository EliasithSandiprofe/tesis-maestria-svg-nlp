<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
    <style>
        .texto-diseno {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 28px;
            letter-spacing: 2px;
            text-anchor: middle;
            fill: #FFFFFF;
        }
        .estilo-vintage {
            filter: sepia(0.4) contrast(0.9);
            opacity: 0.85;
        }
    </style>

    <g class="estilo-vintage">
        <path d="M 150 100 
                 L 200 60 
                 L 250 80 
                 L 300 60 
                 L 350 100 
                 L 390 150 
                 L 340 190 
                 L 320 170 
                 L 320 420 
                 L 180 420 
                 L 180 170 
                 L 160 190 
                 Z" 
              fill="verde" 
              stroke="#2D3142" 
              stroke-width="6" 
              stroke-linejoin="round" />

        <rect x="225" y="215" width="50" height="50" fill="verde" stroke="#000000" stroke-width="2" />

        <text x="250" y="360" class="texto-diseno"></text>
    </g>
</svg>
